name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the Release workflow runs this before it publishes

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The CLI starts
        run: node dist/bin.js --help
